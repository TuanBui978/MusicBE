[package]
name = "music-server"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework & Async runtime
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "timeout"] }

# Database (SQLite async pool + compile/runtime queries)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono"] }

# Serialization (JSON)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling, Env & Logging
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
